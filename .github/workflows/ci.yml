name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Instala DVC con soporte para Azure (ajusta si usan otro remoto)
          pip install "dvc[azure]"

      - name: DVC version
        run: dvc version

      - name: Try DVC pull (optional)
        run: dvc pull || echo "DVC pull skipped (no creds/secrets)"

      - name: Run pipeline or validate DAG
        run: |
          if [ -f data/raw/obesity_estimation_modified.csv ]; then
            dvc repro -f
          else
            echo "Raw data not present; validating DAG only"
            dvc status
          fi

      - name: Upload reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/