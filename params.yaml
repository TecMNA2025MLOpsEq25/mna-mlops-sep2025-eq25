# params.yaml
# Parámetros centralizados del proyecto (datos, features, split, target, modelo y HPO)
data:
  raw_path: data/raw/obesity_estimation_modified.csv
  processed_path: data/processed/obesity_estimation_clean.csv
  interim_dir: data/interim

split:
  test_size: 0.3
  random_state: 42
  stratify: true

features:
  num_cols: ["Age", "Height", "Weight", "FCVC", "NCP", "CH2O", "FAF", "TUE"]
  cat_cols: ["Gender", "MTRANS", "CALC"]
  bin_cols: ["FAVC", "SCC", "SMOKE", "family_history_with_overweight"]
  ordinal_cols: ["CAEC"]
  # en minúsculas; el pipeline normaliza igual
  ordinal_categories:
    CAEC: ["no", "sometimes", "frequently", "always"]

target:
  name: "NObeyesdad"
  metric_primary: "f1_macro"
  metrics_secondary: ["accuracy", "precision_macro", "recall_macro", "roc_auc_ovr"]

model:
  type: "hist_gb"                     # valor por defecto
  candidates: ["hist_gb", "rf", "svc_rbf", "logreg"]

  params:
    learning_rate: 0.1
    max_iter: 300
    random_state: 42
    l2_regularization: 0.0
    max_depth:

  search:
    enabled: true
    kind: grid                        # grid | random
    cv: 5
    n_jobs: -1
    verbose: 1
    n_iter: 40                        # solo si kind=random

  search_space:
    hist_gb:
      learning_rate: [0.05, 0.1, 0.2]
      max_iter: [200, 300, 500]
      l2_regularization: [0.0, 0.1, 0.5]
      max_depth: [null, 6, 12]
    rf:
      n_estimators: [200, 400, 800]
      max_depth: [null, 10, 20]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      bootstrap: [true, false]
    svc_rbf:
      C: [0.1, 1, 10, 50]
      gamma: ["scale", 0.01, 0.001]
    logreg:
      C: [0.1, 1, 5, 10]
      penalty: ["l2"]
      solver: ["lbfgs"]
      max_iter: [500, 1000]


