# params.yaml
# Parámetros centralizados del proyecto (datos, features, modelo y evaluación)

data:
  raw_path: data/raw/obesity_estimation_modified.csv
  processed_path: data/processed/obesity_estimation_clean.csv
  interim_dir: data/interim

split:
  test_size: 0.3
  random_state: 42
  stratify: true

features:
  # Ajusta estas listas a tus columnas reales del dataset
  num_cols: ["Age", "Height", "Weight", "FCVC", "NCP", "CH2O", "FAF", "TUE"]
  cat_cols: ["Gender", "MTRANS", "CALC"]
  bin_cols: ["FAVC", "SCC", "SMOKE", "family_history_with_overweight"]
  ordinal_cols: ["CAEC"]
  ordinal_categories:
    CAEC: ["no", "Sometimes", "Frequently", "Always"]

target:
  name: "NObeyesdad"
  metric_primary: "f1_macro"
  metrics_secondary: ["accuracy", "precision_macro", "recall_macro", "roc_auc_ovr"]

model:
  # type: logreg | random_forest | hist_gb | svc_rbf
  type: "hist_gb"
  params:
    learning_rate: 0.1
    max_depth: null
    max_iter: 300
    l2_regularization: 0.0
    random_state: 42

