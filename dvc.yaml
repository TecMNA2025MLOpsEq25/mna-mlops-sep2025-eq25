stages:
  prepare:
    cmd: python src/scripts/01_cleaning.py --input 
      data/raw/obesity_estimation_modified.csv --output 
      data/processed/obesity_estimation_clean.csv
    deps:
    - data/raw/obesity_estimation_modified.csv
    - src/scripts/01_cleaning.py
    outs:
    - data/processed/obesity_estimation_clean.csv
  eda:
    cmd: python src/scripts/02_eda.py --input 
      data/processed/obesity_estimation_clean.csv --outdir reports
    deps:
    - data/processed/obesity_estimation_clean.csv
    - src/scripts/02_eda.py
    outs:
    - reports/eda_summary.json
    - reports/figures
  preprocessing:
    cmd: python src/scripts/03_preprocessing.py --input 
      data/processed/obesity_estimation_clean.csv --output_train 
      data/prepared/train_preprocessed.csv --output_test 
      data/prepared/test_preprocessed.csv --target NObeyesdad --model_preproc 
      models/preprocessor.joblib
    deps:
    - data/processed/obesity_estimation_clean.csv
    - src/scripts/03_preprocessing.py
    outs:
    - data/prepared/test_preprocessed.csv
    - data/prepared/train_preprocessed.csv
    - data/prepared/y_test.csv
    - data/prepared/y_train.csv
    - models/preprocessor.joblib
  training:
    cmd: python src/scripts/04_training.py --x_train 
      data/prepared/train_preprocessed.csv --x_test 
      data/prepared/test_preprocessed.csv --y_train data/prepared/y_train.csv 
      --y_test data/prepared/y_test.csv --out_model models/best_model.pkl 
      --out_metrics reports/metrics.json --out_figdir reports/figures_training
    deps:
    - data/prepared/test_preprocessed.csv
    - data/prepared/train_preprocessed.csv
    - data/prepared/y_test.csv
    - data/prepared/y_train.csv
    - src/scripts/04_training.py
    outs:
    - models/best_model.pkl
    - reports/figures_training
    metrics:
    - reports/metrics.json:
        cache: false
